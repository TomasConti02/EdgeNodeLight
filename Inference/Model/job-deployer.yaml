apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: simple-cnn-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: simple-cnn-copy-job
  namespace: default
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: model-writer
          image: tomasconti02/resnet_model_test:v2
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "=== Starting model copy ==="
              mkdir -p /mnt/models
              
              if [ -f /app/model/1/saved_model.pb ]; then
                echo "Model found in /app/model/1/, copying to PVC..."
                cp -r /app/model/1 /mnt/models/
              elif [ -f /app/model/saved_model.pb ]; then
                echo "Model found in /app/model/, copying to PVC..."
                mkdir -p /mnt/models/1
                cp -r /app/model/. /mnt/models/1/
              else
                echo "ERROR: No valid model found!"
                ls -laR /app/ || true
                exit 1
              fi
              
              echo "=== Checking PVC content ==="
              ls -laR /mnt/models/
              
              if [ ! -f /mnt/models/1/saved_model.pb ]; then
                echo "CRITICAL ERROR: saved_model.pb not found!"
                exit 1
              fi
              
              chmod -R 755 /mnt/models/
              echo "=== Copy completed successfully ==="
          volumeMounts:
            - name: model-storage
              mountPath: /mnt/models
      volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: simple-cnn-pvc
---

apiVersion: v1
kind: ConfigMap
metadata:
  name: tf-batching-config
  namespace: default
data:
  batching_params.pbtxt: |
    max_batch_size { value: 16 }
    batch_timeout_micros { value: 10000 } #10ms
    max_enqueued_batches { value: 500 }
    num_batch_threads { value: 4 }
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: simple-cnn
  namespace: default
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
    sidecar.istio.io/inject: "false"
spec:
  predictor:
    minReplicas: 1
    timeout: 60
    nodeSelector:
      kubernetes.io/hostname: nvidia-ca7
    volumes:
      - name: model-storage
        persistentVolumeClaim:
          claimName: simple-cnn-pvc
      - name: batching-config-volume
        configMap:
          name: tf-batching-config
    hostAliases:
      - ip: "127.0.0.1"
        hostnames:
          - "simple-cnn-predictor"
          - "simple-cnn-predictor.default"
          - "simple-cnn-predictor.default.svc.cluster.local"
    containers:
      - name: kserve-container
        image: tomasconti02/rpc_v2_glocery:v60
        command:
          - python
          - -m
          - transformer
        args:
          - --model_names
          - simple-cnn
          - --namespace
          - default
          - --predictor_host
          - "127.0.0.1:9000"
          - --broker
          - "http://kafka-broker-ingress.knative-eventing.svc.cluster.local/default/kafka-broker"
          - --broker_host
          - "kafka-broker-ingress.knative-eventing.svc.cluster.local"
          - --ce_type
          - "org.kubeflow.serving.inference.request"
        env:
          - name: WORKERS
            value: "4"
          - name: NUM_WORKERS
            value: "4"
          - name: TRACE
            value: "false"
          - name: UVICORN_ACCESS_LOG
            value: "0"
          - name: TF_CPP_MIN_LOG_LEVEL
            value: "3"
          - name: PYTHONWARNINGS
            value: "ignore"
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
          limits:
            cpu: "4"
            memory: "8Gi"
        ports:
          - containerPort: 8080
            name: http1
            protocol: TCP
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10

      - name: predictor
        image: tensorflow/serving:latest-gpu
        args:
          - --model_name=simple-cnn
          - --port=9000
          - --rest_api_port=8082
          - --model_base_path=/mnt/models
          - --rest_api_timeout_in_ms=60000
          - --per_process_gpu_memory_fraction=0.45
          - --enable_batching=true
          - --batching_parameters_file=/mnt/config/batching_params.pbtxt
        env:
          - name: TF_FORCE_GPU_ALLOW_GROWTH
            value: "true"
          - name: NVIDIA_VISIBLE_DEVICES
            value: "all"
          - name: NVIDIA_DRIVER_CAPABILITIES
            value: "compute,utility"
          - name: LD_LIBRARY_PATH
            value: "/usr/local/cuda/lib64:/usr/local/cuda/lib"
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "4"
            memory: "8Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
          - name: model-storage
            mountPath: /mnt/models
          - name: batching-config-volume
            mountPath: /mnt/config
        ports:
          - containerPort: 9000
            name: grpc
            protocol: TCP
          - containerPort: 8082
            name: rest
            protocol: TCP
        readinessProbe:
          tcpSocket:
            port: 8082
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8082
          initialDelaySeconds: 60
          periodSeconds: 10

---
